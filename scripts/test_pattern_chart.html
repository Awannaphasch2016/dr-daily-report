<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Pattern Lines Test</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { color: #fff; }
    .chart-container {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-line {
      width: 20px;
      height: 3px;
      border-radius: 2px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chart Pattern Lines Test</h1>
    <p>Testing pattern line visualization with mock VCP pattern data</p>
    <div id="root"></div>
  </div>

  <script type="text/babel">
    const { ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceArea, Customized } = Recharts;

    // Mock price data (90 days)
    const generatePriceData = () => {
      const data = [];
      let price = 150;
      const startDate = new Date('2025-10-01');

      for (let i = 0; i < 90; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);

        // Add some price movement with pattern-like behavior
        const trend = Math.sin(i / 15) * 10;
        const noise = (Math.random() - 0.5) * 5;
        const open = price + noise;
        const close = price + trend + noise;
        const high = Math.max(open, close) + Math.random() * 3;
        const low = Math.min(open, close) - Math.random() * 3;

        data.push({
          date: date.toISOString().split('T')[0],
          open: +open.toFixed(2),
          high: +high.toFixed(2),
          low: +low.toFixed(2),
          close: +close.toFixed(2),
          volume: Math.floor(Math.random() * 10000000) + 5000000,
        });

        price = close;
      }
      return data;
    };

    const priceData = generatePriceData();

    // Mock VCP pattern (Bullish Volatility Contraction Pattern)
    // Points: A (high) -> B (low) -> C (lower high) -> D (higher low) -> E (current)
    const mockPattern = {
      type: 'bullish_vcp',
      pattern: 'VCPU',
      confidence: 'medium',
      start: 'bar_20',
      end: 'bar_60',
      implementation: 'stock_pattern',
      points: {
        A: [priceData[20].date, priceData[20].high],  // First peak
        B: [priceData[30].date, priceData[30].low],   // First trough
        C: [priceData[40].date, priceData[40].high],  // Second peak (lower)
        D: [priceData[50].date, priceData[50].low],   // Second trough (higher)
        E: [priceData[60].date, priceData[60].close], // Current
      },
      extra_points: {
        direction: [priceData[40].date, priceData[40].high],
      },
    };

    // Pattern validation helper
    function isValidPatternPoint(point) {
      if (!Array.isArray(point) || point.length !== 2) return false;
      const [timestamp, price] = point;
      return typeof timestamp === 'string' && typeof price === 'number' && !isNaN(price);
    }

    // Find data index by date
    function findDataIndex(data, timestamp) {
      const targetDate = timestamp.split('T')[0];
      return data.findIndex(d => d.date === targetDate || d.date.startsWith(targetDate));
    }

    // Pattern Lines Component
    function PatternLines({ xAxisMap, yAxisMap, patterns, data }) {
      const xAxis = xAxisMap?.[0];
      const yAxis = yAxisMap?.[0];

      if (!xAxis?.scale || !yAxis?.scale) return null;

      const xScale = xAxis.scale;
      const yScale = yAxis.scale;

      return (
        <g className="pattern-lines">
          {patterns.map((pattern, idx) => {
            const pointEntries = Object.entries(pattern.points);
            if (pointEntries.length < 2) return null;

            // Sort by label (A, B, C, D, E)
            const sorted = pointEntries.sort(([a], [b]) => a.localeCompare(b));

            // Convert to pixel coords
            const pixels = [];
            for (const [label, point] of sorted) {
              if (!isValidPatternPoint(point)) continue;
              const [timestamp, price] = point;
              const dataIdx = findDataIndex(data, timestamp);
              if (dataIdx < 0) continue;

              const x = xScale(data[dataIdx].date);
              const y = yScale(price);

              if (typeof x === 'number' && typeof y === 'number') {
                pixels.push({ label, x, y, price });
              }
            }

            if (pixels.length < 2) return null;

            // Create path
            const pathD = pixels.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
            const color = pattern.type.includes('bullish') ? '#22c55e' : '#ef4444';

            return (
              <g key={`pattern-${idx}`}>
                {/* Polyline connecting points */}
                <path
                  d={pathD}
                  fill="none"
                  stroke={color}
                  strokeWidth={2.5}
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />

                {/* Point markers with labels */}
                {pixels.map((p) => (
                  <g key={`point-${p.label}`}>
                    <circle cx={p.x} cy={p.y} r={5} fill={color} stroke="#fff" strokeWidth={2} />
                    <text x={p.x} y={p.y - 12} textAnchor="middle" fill={color} fontSize={11} fontWeight="bold">
                      {p.label}
                    </text>
                    <text x={p.x} y={p.y + 18} textAnchor="middle" fill="#888" fontSize={9}>
                      ${p.price.toFixed(0)}
                    </text>
                  </g>
                ))}

                {/* Direction line */}
                {pattern.extra_points?.direction && (() => {
                  const [ts, price] = pattern.extra_points.direction;
                  const dataIdx = findDataIndex(data, ts);
                  if (dataIdx < 0) return null;
                  const x = xScale(data[dataIdx].date);
                  const y = yScale(price);
                  const endX = xScale(data[Math.min(dataIdx + 15, data.length - 1)].date);

                  return (
                    <line x1={x} y1={y} x2={endX} y2={y}
                      stroke={color} strokeWidth={1.5} strokeDasharray="6 3" opacity={0.7} />
                  );
                })()}
              </g>
            );
          })}
        </g>
      );
    }

    // Candlestick shape
    function CandlestickShape(props) {
      const { x, width, payload, yDomain } = props;
      if (!payload || width <= 0) return null;

      const priceRange = yDomain[1] - yDomain[0];
      const chartHeight = 350;

      const priceToY = (price) => {
        const ratio = (yDomain[1] - price) / priceRange;
        return ratio * chartHeight + 10;
      };

      const highY = priceToY(payload.high);
      const lowY = priceToY(payload.low);
      const openY = priceToY(payload.open);
      const closeY = priceToY(payload.close);

      const candleTop = Math.min(openY, closeY);
      const candleBottom = Math.max(openY, closeY);
      const isGreen = payload.close >= payload.open;
      const color = isGreen ? '#26a69a' : '#ef5350';

      const candleWidth = Math.max(width * 0.7, 2);
      const candleX = x + (width - candleWidth) / 2;
      const wickX = x + width / 2;

      return (
        <g>
          <line x1={wickX} y1={highY} x2={wickX} y2={lowY} stroke={color} strokeWidth={1} />
          <rect x={candleX} y={candleTop} width={candleWidth} height={Math.max(candleBottom - candleTop, 1)} fill={color} />
        </g>
      );
    }

    // Main Chart Component
    function PatternChart() {
      const prices = priceData.flatMap(d => [d.low, d.high]);
      const minPrice = Math.min(...prices);
      const maxPrice = Math.max(...prices);
      const padding = (maxPrice - minPrice) * 0.08;
      const yDomain = [minPrice - padding, maxPrice + padding];

      // Pattern area bounds
      const patternStartIdx = 20;
      const patternEndIdx = 60;
      const patternData = priceData.slice(patternStartIdx, patternEndIdx + 1);
      const patternHigh = Math.max(...patternData.map(d => d.high));
      const patternLow = Math.min(...patternData.map(d => d.low));

      return (
        <div className="chart-container">
          <div className="legend">
            <div className="legend-item">
              <svg width="24" height="14" viewBox="0 0 24 14">
                <path d="M2 10 L8 4 L16 8 L22 3" fill="none" stroke="#22c55e" strokeWidth="2" />
                <circle cx="2" cy="10" r="3" fill="#22c55e" />
                <circle cx="8" cy="4" r="3" fill="#22c55e" />
                <circle cx="16" cy="8" r="3" fill="#22c55e" />
                <circle cx="22" cy="3" r="3" fill="#22c55e" />
              </svg>
              <span>Bullish VCP (A→B→C→D→E)</span>
            </div>
            <div className="legend-item">
              <div className="legend-dot" style={{background: '#26a69a'}}></div>
              <span>Bullish Candle</span>
            </div>
            <div className="legend-item">
              <div className="legend-dot" style={{background: '#ef5350'}}></div>
              <span>Bearish Candle</span>
            </div>
          </div>

          <ResponsiveContainer width="100%" height={400}>
            <ComposedChart data={priceData} margin={{ top: 10, right: 30, left: 10, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#374151" opacity={0.3} />

              <XAxis
                dataKey="date"
                tick={{ fill: '#888', fontSize: 10 }}
                tickFormatter={(v) => {
                  const d = new Date(v);
                  return `${d.getMonth()+1}/${d.getDate()}`;
                }}
              />

              <YAxis
                domain={yDomain}
                tick={{ fill: '#888', fontSize: 10 }}
                tickFormatter={(v) => `$${v.toFixed(0)}`}
              />

              <Tooltip
                contentStyle={{ background: '#1e293b', border: '1px solid #334155', borderRadius: 8 }}
                labelStyle={{ color: '#94a3b8' }}
              />

              {/* Pattern area highlight */}
              <ReferenceArea
                x1={priceData[patternStartIdx].date}
                x2={priceData[patternEndIdx].date}
                y1={patternLow}
                y2={patternHigh}
                fill="rgba(34, 197, 94, 0.1)"
                stroke="#22c55e"
                strokeWidth={1}
                strokeDasharray="4 2"
              />

              {/* Pattern Lines */}
              <Customized
                component={(props) => (
                  <PatternLines
                    xAxisMap={props.xAxisMap}
                    yAxisMap={props.yAxisMap}
                    patterns={[mockPattern]}
                    data={priceData}
                  />
                )}
              />

              {/* Candlesticks */}
              <Bar
                dataKey="high"
                shape={(props) => <CandlestickShape {...props} yDomain={yDomain} />}
                isAnimationActive={false}
              />
            </ComposedChart>
          </ResponsiveContainer>

          <div style={{marginTop: 15, fontSize: 12, color: '#888'}}>
            <strong>Pattern Details:</strong> {mockPattern.type} ({mockPattern.pattern}) - {mockPattern.confidence} confidence
            <br />
            <strong>Points:</strong> {Object.entries(mockPattern.points).map(([k, v]) => `${k}:$${v[1].toFixed(0)}`).join(' → ')}
          </div>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PatternChart />);
  </script>
</body>
</html>
